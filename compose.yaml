# Shared native TP2 service; each node supplies its own private .env.
name: "${PROJECT_NAME:-glm53-native}"
services:
  glm53:
    container_name: "${CONTAINER_NAME:-glm53-native}"
    devices:
      -
        source: "/dev/infiniband"
        target: "/dev/infiniband"
        permissions: "rwm"
      -
        source: "/dev/dri/card0"
        target: "/dev/dri/card0"
        permissions: "rwm"
    environment:
      ALLOW_STOCK: ""
      API_PORT: "${API_PORT:-8000}"
      CONTAINER_NAME: "${CONTAINER_NAME:-glm53-native}"
      CUDAGRAPH_CAPTURE_SIZES: ""
      CUDAGRAPH_METRICS: ""
      DECODE_RESERVE_TOKENS: ""
      DFLASH_MODEL: "${DFLASH_MODEL:?Set DFLASH_MODEL in .env}"
      EXTRA_ARGS: "--mm-processor-cache-gb ${MM_PROCESSOR_CACHE_GB:-1} --scheduler-cls vllm.v1.core.sched.adaptive_k.AdaptiveKScheduler --served-model-name ${MODEL_ALIASES:-glm53 nvidia/GLM-5.3-Flash-NVFP4}"
      FABRIC_CHECK: ""
      FABRIC_SUBNETS: "${FABRIC_SUBNETS:?Set FABRIC_SUBNETS in .env}"
      FABRIC_WAIT_S: "180"
      GLM53_DISPLAY_KV_ENABLE: "${GLM53_DISPLAY_KV_ENABLE:-1}"
      GLM53_DISPLAY_KV_MIN_BYTES: "${GLM53_DISPLAY_KV_MIN_BYTES:-4294967296}"
      GPU_MEM_UTIL: "${GPU_MEM_UTIL:-0.88}"
      HEAD_HOST: "${HEAD_HOST:?Set HEAD_HOST in .env}"
      ITERATION_DETAILS: ""
      KV_CACHE_DTYPE: ""
      KV_CACHE_MEMORY: "${KV_CACHE_MEMORY:-8589934592}"
      LIMIT_MM: "${LIMIT_MM:?Set LIMIT_MM in .env}"
      LONG_PREFILL_TOKEN_THRESHOLD: "${LONG_PREFILL_TOKEN_THRESHOLD:-}"
      MAX_JOBS: ""
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-1047552}"
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS:-4096}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS:-4}"
      MCP_LOG_DIR: "/logs"
      MODEL_DIR: "${MODEL_DIR:?Set MODEL_DIR in .env}"
      MOE_BACKEND: ""
      MTP: ""
      NCCL_DEBUG: ""
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_HCA: "${NCCL_IB_HCA:-}"
      NCCL_MAX_NCHANNELS: ""
      NCCL_MIN_NCHANNELS: ""
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME:-}"
      NVIDIA_VISIBLE_DEVICES: "all"
      PEERS: ""
      PREFLIGHT: ""
      PYTORCH_CUDA_ALLOC_CONF: ""
      ROCE_SETTLE_S: ""
      ROLE: "${ROLE:?Set ROLE in .env}"
      SAFETENSORS_LOAD_STRATEGY: ""
      SELF_TEST: ""
      SERVED_NAME: "${SERVED_NAME:-glm53}"
      SERVICE_NAME: "${SERVICE_NAME:-glm53}"
      SKIP_MM_PROFILING: "${SKIP_MM_PROFILING:-}"
      SPEC_EXTRA: "{\"disable_eagle_block_drop\":true,\"attention_backend\":\"TRITON_ATTN\",\"num_speculative_tokens_per_batch_size\":[[1,1,7],[2,2,5],[3,3,4],[4,4,3],[5,5,2],[6,32,7]]}"
      SPEC_METHOD: ""
      SPEC_TOKENS: ""
      STATUS_PORT: "${STATUS_PORT:-8082}"
      THROUGHPUT_INTERVAL_S: "60"
      TOOL_PARSER: ""
      TORCH_MEM_FRACTION: "${TORCH_MEM_FRACTION:-0.92}"
      TORCH_MEM_STATS_DIR: "/logs"
      TORCH_MEM_STATS_INTERVAL: ""
      TORCH_MEM_TRACE_DIR: ""
      TP: "${TP:-2}"
      VLLM_ADAPTIVE_K_CODE_MODE: "gated"
      VLLM_ADAPTIVE_K_CONTROL: "/root/.cache/adaptive-k"
      VLLM_ADAPTIVE_K_COST_MS: "2:29.7,3:33.1,4:36.5,5:39.8,6:43.1,7:46.0,8:48.9"
      VLLM_ADAPTIVE_K_MODEL: ""
      VLLM_ADAPTIVE_K_ONLINE: "1"
      VLLM_ADAPTIVE_K_PER_REQUEST: "0"
      VLLM_ARXBIG: "1"
      VLLM_ARXBIG_AG: "0"
      VLLM_ARXBIG_RS: "1"
      VLLM_ARX_ALLREDUCE: "1"
      VLLM_ARX_TWO_SHOT_MAX_KB: "2048"
      VLLM_DENSE_FP8: "1"
      VLLM_DENSE_FP8_LM_HEAD: "1"
      VLLM_DENSE_W4: "in_proj_qkvbfg_a$$|^model\\.|self_attn\\.o_proj$$|shared_experts\\.(gate_up_proj|down_proj)$$"
      VLLM_DRAFT_TRUNC_CONTROL: "/root/.cache/draft-trunc"
      VLLM_DRAFT_TRUNC_EXPLORE: "4"
      VLLM_DRAFT_TRUNC_LOG: ""
      VLLM_DRAFT_TRUNC_TAU: "0.3"
      VLLM_GLM5NEXT_DRAFT_BLOCK_SIZE: ""
      VLLM_GLM5NEXT_DRAFT_POOL: "1"
      VLLM_GLM5NEXT_RECOVERSSM: "1"
      VLLM_GLM_ARX_PREFETCH: "1"
      VLLM_GLM_SP_FP8_GATHER: "1"
      VLLM_GLM_SP_MIN_TOKENS: "1024"
      VLLM_GLM_SP_MOE_CHECK: "0"
      VLLM_GLM_SP_MOE_FUSED: "1"
      VLLM_GLM_SP_MOE_QUANT_GATHER: "1"
      VLLM_GLM_SP_TP: "1"
      VLLM_HOST_IP: "${VLLM_HOST_IP:?Set VLLM_HOST_IP in .env}"
      VLLM_MEGAMOE: "1"
      VLLM_MEGAMOE_MAX_TOKENS: "8"
      VLLM_MEGAMOE_VARIANT: "20"
      VLLM_MHC_FUSED_MAX_TOKENS: "32"
      VLLM_MOE_PREFILL: "1"
      VLLM_MOE_PREFILL_CHECK: "0"
      VLLM_MOE_PREFILL_MIN_TOKENS: "1024"
      VLLM_MOE_PREFILL_Y8: "1"
      VLLM_TRITON_SPARSE_MLA: "1"
      VLLM_WEIGHT_SNAPSHOT_DIR: "/root/.cache/weight-snapshots"
      VLLM_WEIGHT_SNAPSHOT_TAG: "fp8w4c-2026-09-28"
      WORKER_WAIT_S: "600"
      NODE_RANK: "${NODE_RANK:?Set NODE_RANK in .env}"
      MASTER_PORT: "${MASTER_PORT:-29553}"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      VLLM_WEIGHT_SNAPSHOT_SEED_DIR: "/weight-snapshot-seed"
      FABRIC_CHECK_PORT: "${FABRIC_CHECK_PORT:-29511}"
    group_add:
      - "${DRM_CARD_GID:-44}"
    image: "${IMAGE:?Set IMAGE in .env}"
    ipc: "host"
    network_mode: "host"
    restart: "no"
    ulimits:
      core:
        soft: 0
        hard: 0
      memlock: -1
      stack: 67108864
    volumes:
      -
        type: "bind"
        source: "${MODEL_HOST_DIR:?Set MODEL_HOST_DIR in .env}"
        target: "/models/glm-5.3-flash-nvfp4"
        read_only: true
        bind:
          create_host_path: false
      -
        type: "bind"
        source: "/run/systemd/units"
